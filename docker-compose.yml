# ============================================================
# MediCore SaaS — docker-compose.yml
# Producción: App + PostgreSQL + Redis + MinIO + Nginx
# Uso: docker-compose up -d
# ============================================================

version: '3.8'

services:

  # ── Aplicación Node.js ──────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medicore_app
    restart: unless-stopped
    environment:
      NODE_ENV:           production
      PORT:               3000
      DB_TYPE:            postgres
      DB_HOST:            postgres
      DB_PORT:            5432
      DB_NAME:            ${DB_NAME:-medicore}
      DB_USER:            ${DB_USER:-medicore_user}
      DB_PASSWORD:        ${DB_PASSWORD:?Define DB_PASSWORD in the root .env file}
      REDIS_HOST:         redis
      REDIS_PORT:         6379
      REDIS_PASSWORD:     ${REDIS_PASSWORD:?Define REDIS_PASSWORD in the root .env file}
      JWT_SECRET:         ${JWT_SECRET:?Define JWT_SECRET in the root .env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET in the root .env file}
      JWT_EXPIRES_IN:     15m
      JWT_REFRESH_EXPIRES_IN: 7d
      STORAGE_TYPE:       minio
      MINIO_ENDPOINT:     minio
      MINIO_PORT:         9000
      MINIO_ACCESS_KEY:   ${MINIO_ACCESS_KEY:?Define MINIO_ACCESS_KEY in the root .env file}
      MINIO_SECRET_KEY:   ${MINIO_SECRET_KEY:?Define MINIO_SECRET_KEY in the root .env file}
      MINIO_BUCKET:       medicore-docs
      MINIO_USE_SSL:      "false"
      ENCRYPTION_KEY:     ${ENCRYPTION_KEY:?Define ENCRYPTION_KEY in the root .env file}
      MAIL_HOST:          ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:          ${MAIL_PORT:-587}
      MAIL_USER:          ${MAIL_USER:-}
      MAIL_PASS:          ${MAIL_PASS:-}
      MAIL_FROM:          "MediCore SaaS <noreply@medicore.mx>"
      CORS_ORIGINS:       ${CORS_ORIGINS:-http://localhost,https://tu-dominio.com}
      SEED_DEMO_DATA:     ${SEED_DEMO_DATA:-true}
      LOG_LEVEL:          info
    volumes:
      - ./backend/logs:/app/logs
      - ./frontend/public:/app/frontend/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - medicore_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medicore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-medicore}
      POSTGRES_USER:     ${DB_USER:-medicore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the root .env file}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - medicore_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medicore_user} -d ${DB_NAME:-medicore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"  # Solo localhost (no exponer externamente)

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medicore_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Define REDIS_PASSWORD in the root .env file}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - medicore_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  # ── MinIO (Almacenamiento de documentos cifrados) ───────
  minio:
    image: minio/minio:latest
    container_name: medicore_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:?Define MINIO_ACCESS_KEY in the root .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Define MINIO_SECRET_KEY in the root .env file}
    volumes:
      - minio_data:/data
    networks:
      - medicore_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:9000:9000"   # API
      - "127.0.0.1:9001:9001"   # Console

  # ── Nginx (Reverse proxy + SSL) ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: medicore_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/public:/var/www/medicore:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - medicore_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Volúmenes persistentes ──────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  nginx_logs:
    driver: local

# ── Red interna ──────────────────────────────────────────
networks:
  medicore_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
