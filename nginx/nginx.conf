# ============================================================
# MediCore SaaS — nginx/nginx.conf
# Reverse proxy + SSL + seguridad + caché + rate limiting
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Formato de logs ──────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Opciones de rendimiento ──────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;       # Ocultar versión de Nginx
    client_max_body_size 30M;     # Para subida de documentos

    # ── Compresión gzip ──────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_buffers      16 8k;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/x-font-ttf font/opentype image/svg+xml;

    # ── Rate limiting por zona ───────────────────────────
    limit_req_zone  $binary_remote_addr zone=api:10m       rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m      rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=upload:10m    rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Caché de archivos estáticos ──────────────────────
    open_file_cache          max=10000 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Upstream — Node.js app ───────────────────────────
    upstream medicore_app {
        server app:3000;
        keepalive 32;
    }

    # ── Upstream — MinIO ─────────────────────────────────
    upstream medicore_minio {
        server minio:9000;
        keepalive 16;
    }

    # ══════════════════════════════════════════
    # Servidor HTTP — Redirigir a HTTPS
    # ══════════════════════════════════════════
    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirigir todo a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════
    # Servidor HTTPS Principal
    # ══════════════════════════════════════════
    server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name tu-dominio.com www.tu-dominio.com;

        # ── SSL ──────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Protocolos y cifrados seguros
        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers  off;
        ssl_session_cache          shared:SSL:10m;
        ssl_session_timeout        1d;
        ssl_session_tickets        off;
        ssl_stapling               on;
        ssl_stapling_verify        on;

        # ── Cabeceras de seguridad ────────────────────────
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "SAMEORIGIN" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header X-XSS-Protection           "1; mode=block" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.tailwindcss.com cdnjs.cloudflare.com cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

        # Límite de conexiones simultáneas
        limit_conn conn_limit 20;

        # ── Health check (sin rate limit) ─────────────────
        location /health {
            proxy_pass http://medicore_app;
            access_log off;
        }

        # ── API REST ──────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass         http://medicore_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            proxy_connect_timeout  60s;
            proxy_send_timeout     120s;
            proxy_read_timeout     120s;
            proxy_buffering        on;
            proxy_buffer_size      4k;
            proxy_buffers          8 4k;
        }

        # ── Auth endpoints (rate limit más estricto) ──────
        location /api/v1/auth/login {
            limit_req zone=auth burst=3 nodelay;

            proxy_pass         http://medicore_app;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Upload de documentos ──────────────────────────
        location /api/v1/documents/upload {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 30M;

            proxy_pass         http://medicore_app;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── WebSocket (Socket.IO) ─────────────────────────
        location /socket.io/ {
            proxy_pass         http://medicore_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "Upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Archivos estáticos del Frontend ───────────────
        location / {
            root  /var/www/medicore;
            index index.html;

            # Caché agresivo para assets con hash
            location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|woff|ttf)$ {
                expires    1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options nosniff;
            }

            # HTML nunca en caché
            location ~* \.html$ {
                expires    -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }

            # SPA fallback
            try_files $uri $uri/ /index.html;
        }

        # ── Bloquear acceso a archivos sensibles ──────────
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~ \.(env|log|sql|bak|backup)$ {
            deny all;
            return 404;
        }
    }

    # ══════════════════════════════════════════
    # MinIO Console (solo acceso local/VPN)
    # ══════════════════════════════════════════
    server {
        listen      9001 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Solo IPs internas
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        location / {
            proxy_pass http://medicore_minio;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
